<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CatCNN Network Animation</title>
  <style>
    :root {
      --bg: #0f1116;
      --panel: #171a22;
      --text: #e6e9ef;
      --muted: #9aa3b2;
      --accent: #7cc7ff;
      --pos: #ff8a4c;
      --neg: #69b7ff;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }
    .controls {
      background: var(--panel);
      border: 1px solid #252a38;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
    }
    .controls input[type="file"] {
      color: var(--muted);
    }
    .controls button {
      background: #222838;
      color: var(--text);
      border: 1px solid #33405a;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .status {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 10px;
    }
    .meta {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }
    .card {
      background: var(--panel);
      border: 1px solid #252a38;
      border-radius: 10px;
      padding: 10px;
    }
    .k { color: var(--muted); font-size: 12px; display: block; }
    .v { font-weight: 600; font-size: 16px; }
    svg {
      width: 100%;
      height: 620px;
      background: linear-gradient(180deg, #121621 0%, #0f1116 100%);
      border: 1px solid #252a38;
      border-radius: 12px;
    }
    .legend {
      display: flex;
      gap: 14px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CatCNN — Animated Neuron View</h1>
    <div class="controls">
      <input id="fileInput" type="file" accept="application/json" />
      <button id="loadDefaultBtn">Load default JSON</button>
      <button id="pauseBtn">Pause</button>
    </div>
    <div id="status" class="status">Load a JSON file generated by <code>export_animation_data.py</code>.</div>

    <div class="meta">
      <div class="card"><span class="k">Prediction</span><span id="predictionLabel" class="v">-</span></div>
      <div class="card"><span class="k">P(cat)</span><span id="predictionProb" class="v">-</span></div>
      <div class="card"><span class="k">Model</span><span id="modelPath" class="v" style="font-size:13px">-</span></div>
      <div class="card"><span class="k">Image</span><span id="imagePath" class="v" style="font-size:13px">-</span></div>
    </div>

    <svg id="networkSvg" viewBox="0 0 1160 620" preserveAspectRatio="xMidYMid meet"></svg>

    <div class="legend">
      <span><span class="dot" style="background: var(--pos)"></span>Positive activation</span>
      <span><span class="dot" style="background: var(--neg)"></span>Negative activation</span>
      <span>Node size and glow represent activation magnitude</span>
    </div>
  </div>

  <script>
    const svg = document.getElementById("networkSvg");
    const statusEl = document.getElementById("status");
    const pauseBtn = document.getElementById("pauseBtn");

    const layerOrder = ["input", "conv1", "pool1", "conv2", "pool2", "flatten", "output"];

    let modelData = null;
    let running = true;
    let t = 0;

    let nodes = [];
    let edges = [];

    function normSigned(value, min, max) {
      const bound = Math.max(Math.abs(min), Math.abs(max), 1e-8);
      return value / bound;
    }

    function createSvgElement(name, attrs = {}) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", name);
      for (const [k, v] of Object.entries(attrs)) {
        el.setAttribute(k, String(v));
      }
      return el;
    }

    function clearSvg() {
      while (svg.firstChild) svg.removeChild(svg.firstChild);
    }

    function prepareNodesAndEdges(data) {
      nodes = [];
      edges = [];

      const layers = layerOrder
        .map(name => data.layers.find(layer => layer.name === name))
        .filter(Boolean);

      const left = 80;
      const right = 1080;
      const top = 80;
      const bottom = 560;

      layers.forEach((layer, layerIndex) => {
        const x = left + (layerIndex * (right - left)) / Math.max(layers.length - 1, 1);
        const values = layer.sampled_values;
        const min = layer.stats.min;
        const max = layer.stats.max;
        const count = values.length;

        values.forEach((value, neuronIndex) => {
          const y = count === 1
            ? (top + bottom) / 2
            : top + (neuronIndex * (bottom - top)) / (count - 1);

          nodes.push({
            layerName: layer.name,
            layerIndex,
            neuronIndex,
            x,
            y,
            value,
            min,
            max,
          });
        });
      });

      for (let layerIndex = 0; layerIndex < layers.length - 1; layerIndex++) {
        const fromLayer = nodes.filter(n => n.layerIndex === layerIndex);
        const toLayer = nodes.filter(n => n.layerIndex === layerIndex + 1);

        fromLayer.forEach(fromNode => {
          toLayer.forEach(toNode => {
            let strength = Math.abs(fromNode.value * toNode.value);

            if (fromNode.layerName === "flatten" && toNode.layerName === "output") {
              const sampledWeights = data.dense?.sampled_weights || [];
              const w = sampledWeights[fromNode.neuronIndex] ?? 0;
              strength = Math.abs(fromNode.value * w);
            }

            edges.push({
              from: fromNode,
              to: toNode,
              strength,
            });
          });
        });
      }
    }

    function drawStaticLayerLabels() {
      const layerGroups = new Map();
      nodes.forEach(node => {
        if (!layerGroups.has(node.layerName)) layerGroups.set(node.layerName, []);
        layerGroups.get(node.layerName).push(node);
      });

      for (const [layerName, layerNodes] of layerGroups.entries()) {
        const x = layerNodes[0].x;
        const y = 28;

        const text = createSvgElement("text", {
          x,
          y,
          fill: "#c7d0dd",
          "font-size": 13,
          "text-anchor": "middle",
          "font-family": "Segoe UI, Arial, sans-serif",
        });
        text.textContent = layerName;
        svg.appendChild(text);
      }
    }

    function renderFrame() {
      clearSvg();

      const maxStrength = Math.max(...edges.map(e => e.strength), 1e-8);

      edges.forEach((edge, idx) => {
        const travel = 0.5 + 0.5 * Math.sin(t * 1.7 - edge.from.layerIndex * 0.7 + edge.to.layerIndex * 0.3 + idx * 0.0009);
        const alphaBase = Math.min(0.5, 0.05 + 0.45 * (edge.strength / maxStrength));
        const alpha = alphaBase * (0.6 + 0.4 * travel);

        const line = createSvgElement("line", {
          x1: edge.from.x,
          y1: edge.from.y,
          x2: edge.to.x,
          y2: edge.to.y,
          stroke: "rgba(140,170,220," + alpha.toFixed(4) + ")",
          "stroke-width": Math.max(0.35, 1.2 * edge.strength / maxStrength),
        });

        svg.appendChild(line);
      });

      nodes.forEach(node => {
        const signed = normSigned(node.value, node.min, node.max);
        const magnitude = Math.abs(signed);
        const phase = t * 2.0 - node.layerIndex * 0.8;
        const pulse = 0.7 + 0.3 * (0.5 + 0.5 * Math.sin(phase));

        const radius = 2.5 + 7.5 * magnitude * pulse;
        const color = signed >= 0 ? "var(--pos)" : "var(--neg)";

        const glow = createSvgElement("circle", {
          cx: node.x,
          cy: node.y,
          r: radius * 1.8,
          fill: color,
          opacity: (0.05 + 0.22 * magnitude * pulse).toFixed(4),
        });
        svg.appendChild(glow);

        const circle = createSvgElement("circle", {
          cx: node.x,
          cy: node.y,
          r: radius,
          fill: color,
          opacity: (0.35 + 0.65 * magnitude).toFixed(4),
          stroke: "rgba(255,255,255,0.35)",
          "stroke-width": 0.6,
        });
        svg.appendChild(circle);
      });

      drawStaticLayerLabels();
    }

    function animate() {
      if (running) {
        t += 0.016;
        renderFrame();
      }
      requestAnimationFrame(animate);
    }

    function updateMeta(data) {
      document.getElementById("predictionLabel").textContent = data.meta.predicted_label;
      document.getElementById("predictionProb").textContent = Number(data.meta.prediction).toFixed(4);
      document.getElementById("modelPath").textContent = data.meta.model_path;
      document.getElementById("imagePath").textContent = data.meta.image_path;
    }

    function loadData(data) {
      modelData = data;
      updateMeta(data);
      prepareNodesAndEdges(data);
      renderFrame();
      statusEl.textContent = "Loaded animation data. Press Pause to freeze/resume.";
    }

    async function loadDefaultData() {
      try {
        const resp = await fetch("visualizations/network_animation_data.json", { cache: "no-store" });
        if (!resp.ok) throw new Error("Could not fetch default JSON file");
        const data = await resp.json();
        loadData(data);
      } catch (err) {
        statusEl.textContent = "Default JSON not found. Use the file picker to load a JSON exported by export_animation_data.py.";
      }
    }

    document.getElementById("fileInput").addEventListener("change", async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;

      try {
        const text = await file.text();
        const data = JSON.parse(text);
        loadData(data);
      } catch (err) {
        statusEl.textContent = "Invalid JSON file. Please export again using export_animation_data.py.";
      }
    });

    document.getElementById("loadDefaultBtn").addEventListener("click", loadDefaultData);

    pauseBtn.addEventListener("click", () => {
      running = !running;
      pauseBtn.textContent = running ? "Pause" : "Resume";
      if (running) renderFrame();
    });

    loadDefaultData();
    animate();
  </script>
</body>
</html>
